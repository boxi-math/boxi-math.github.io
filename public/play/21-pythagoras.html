  // the empty space, named when the arrangement is complete
  const dim = (key) => (sel && sel !== key ? 0.3 : 1);
  const hole = (pts, col, key) => { x.save(); x.globalAlpha = dim(key); x.fillStyle = rgba(col, 0.28); path(x, g, pts); x.fill(); x.strokeStyle = col; x.lineWidth = sel === key ? 3.5 : 1.5; x.stroke(); x.restore(); };
  if (u === 0) {
    hole([[a, 0], [s, a], [b, s], [0, b]], CC, "c2");
  } else if (u === 1) {
    hole([[0, b], [a, b], [a, s], [0, s]], CA, "a2");
    hole([[a, 0], [s, 0], [s, b], [a, b]], CB, "b2");
  }
  // triangles
  const TC = TH > 90 ? NO : GR;
  T.forEach((tr) => { path(x, g, tr); x.fillStyle = rgba(TC, TH > 90 ? 0.16 : 0.3); x.fill(); x.strokeStyle = TC; x.lineWidth = 2; x.stroke(); });
  // what doesn't fit: outside the big square, or on top of another triangle
  if (bad) {
    x.save(); x.beginPath(); x.rect(0, 0, w, h); x.moveTo(g.X(0), g.Y(0)); x.lineTo(g.X(0), g.Y(s)); x.lineTo(g.X(s), g.Y(s)); x.lineTo(g.X(s), g.Y(0)); x.closePath();
    x.clip("evenodd"); x.fillStyle = rgba(NO, 0.45); T.forEach((tr) => { path(x, g, tr); x.fill(); }); x.restore();
    for (let i = 0; i < 4; i++) for (let j = i + 1; j < 4; j++) {
      x.save(); path(x, g, T[i]); x.clip(); path(x, g, T[j]); x.fillStyle = rgba(NO, 0.6); x.fill(); x.restore();
    }
  }
  // angle marks
  T.forEach((tr, i) => {
    const Q = tr[0], ua = [(tr[1][0] - Q[0]) / a, (tr[1][1] - Q[1]) / a], vb = [(tr[2][0] - Q[0]) / b, (tr[2][1] - Q[1]) / b];
    const r = Math.min(11, 0.28 * g.p), X0 = g.X(Q[0]), Y0 = g.Y(Q[1]);
    x.strokeStyle = TH > 90 ? NO : FG; x.lineWidth = 1.5; x.beginPath();
    if (TH === 90) { x.moveTo(X0 + ua[0] * r, Y0 - ua[1] * r); x.lineTo(X0 + (ua[0] + vb[0]) * r, Y0 - (ua[1] + vb[1]) * r); x.lineTo(X0 + vb[0] * r, Y0 - vb[1] * r); }
    else { const a0 = Math.atan2(ua[1], ua[0]); x.arc(X0, Y0, r * 1.5, -a0, -(a0 + TH * RAD), true); }
    x.stroke();
    if (i === 0 && TH > 90) {
      const bis = Math.atan2(ua[1] + vb[1], ua[0] + vb[0]);
      Play.text(x, `${TH}°`, X0 + Math.cos(bis) * 36, Y0 - Math.sin(bis) * 36, { size: 14, weight: 700, color: NO });
    }
  });
  x.strokeStyle = FG; x.lineWidth = 2.4; path(x, g, sqr(s)); x.stroke();
  // hole names
  if (u === 0) {
    holeLabel(x, g, s / 2, s / 2, Math.hypot(a, b) * 0.7, "c²", a * a + b * b, FG, dim("c2"));
    const c = Math.hypot(a, b), mx = (a + s) / 2, my = a / 2, nx = (s / 2 - mx), ny = (s / 2 - my), nn = Math.hypot(nx, ny) || 1;
    if (c * g.p > 40) Play.text(x, "c", g.X(mx) + (nx / nn) * 16, g.Y(my) - (ny / nn) * 16, { size: 17, weight: 700, color: FG, italic: true });
  } else if (u === 1) {
    holeLabel(x, g, a / 2, b + a / 2, a, "a²", a * a, FG, dim("a2"));
    holeLabel(x, g, a + b / 2, b / 2, b, "b²", b * b, FG, dim("b2"));
  }
  // side lengths of the big square (hidden while triangles poke out over them)
  if (TH === 90) {
    const br = (x1, y1, x2, y2, col) => { x.strokeStyle = col; x.lineWidth = 2; x.beginPath(); x.moveTo(x1, y1); x.lineTo(x2, y2); x.stroke(); };
    const yb = g.Y(0) + 9, xl = g.X(0) - 9;
    br(g.X(0) + 3, yb, g.X(a) - 3, yb, CA); br(g.X(a) + 3, yb, g.X(s) - 3, yb, CB);
    br(xl, g.Y(0) - 3, xl, g.Y(b) + 3, CB); br(xl, g.Y(b) - 3, xl, g.Y(s) + 3, CA);
    const sl = (nm, v, len) => (tw(x, `${nm} = ${v}`, 15) + 6 < len ? `${nm} = ${v}` : nm);
    Play.text(x, sl("a", a, a * g.p), g.X(a / 2), yb + 14, { size: 15, weight: 700, color: CA });
    Play.text(x, sl("b", b, b * g.p), g.X(a + b / 2), yb + 14, { size: 15, weight: 700, color: CB });
    Play.text(x, "b", xl - 8, g.Y(b / 2), { size: 15, weight: 700, color: CB, align: "right" });
    Play.text(x, "a", xl - 8, g.Y(b + a / 2), { size: 15, weight: 700, color: CA, align: "right" });
  }
  // handles
  if (step === 3) { const tip = T[0][2]; dot(x, g.X(tip[0]), g.Y(tip[1])); geo.H = [g.X(tip[0]), g.Y(tip[1])]; }
  else { dot(x, g.X(a), g.Y(0)); geo.H = [g.X(a), g.Y(0)]; }
  // bottom line
  const c2 = a * a + b * b, big = s * s, four = 2 * a * b;
  if (step === 3) {
    const m = c2Of(th);
    bottomText(x, w, h, th > 90 ? `c² ≈ ${fmt(m, 2)}  >  a² + b² = ${c2}` : `c² = ${c2} = a² + b²`, th > 90 ? NO : null);
  } else if (st.ov > 0) bottomText(x, w, h, t({ en: "Overlapping: slide it all the way", zh: "压住了：挪到底" }), NO);
  else if (u === 0) bottomText(x, w, h, `c² = ${big} − 4 × ${a}×${b}/2 = ${big - four}`);
  else if (u === 1) bottomText(x, w, h, `a² + b² = ${a * a} + ${b * b} = ${c2}`);
  else bottomText(x, w, h, `${big} − ${four} = ${big - four}`);
}
function draw(x, w, h) { if (step === 1) drawLadder(x, w, h); else drawSquare(x, w, h); }

// ---------- explain panel ----------
const sp = (cls, s) => `<span class="${cls}">${s}</span>`;
const term = (key, cls, s) => `<button class="term ${cls}${sel === key ? " sel" : ""}" data-sel="${key}">${s}</button>`;
function render() {
  const S = STEP[step], s = a + b, c2 = a * a + b * b, c = Math.sqrt(c2), u = uni();
  let html = `<div class="kicker">${t(S.kicker)}</div><h2>${t(S.h)}</h2><p>${t(S.p)}</p>`;
  if (step === 1) {
    const opts = ["c = a + b", "c < a + b", "c > a + b"];
    html += `<div class="choices">` + opts.map((o, i) => `<button data-g="${i}" class="${guess === i ? (i === 1 ? "right" : "wrong") : ""}">${o}</button>`).join("") + `</div>`;
    if (guess >= 0) {
      html += `<p>${t({ en: "The apprentice jumps in: just buy one that's a plus b long.", zh: "徒弟抢着说：那就买 a 加 b 那么长的。" })}</p>` +
        `<div class="mathline">${sp("ka", a)} + ${sp("kb", b)} = <span class="kn">${s}</span> &nbsp; ${sp("kc", "c")} ≈ <b>${fmt(c, 2)}</b></div>` +
        `<p>${t({ en: "If c equalled a plus b, the long side would be as long as the two short sides end to end.", zh: "如果 c 等于 a 加 b，斜边就和两条直角边接起来一样长。" })}</p>`;
      if (k > 0.98) html += `<p><span class="tag-no">a + b = c ✗</span> ${t({ en: `Laid along the ladder, a and b stick out by ${fmt(s - c, 2)}. But the straight path is always shorter than going around, so c must be less than a plus b.`, zh: `沿着梯子摆，a 和 b 接起来多出 ${fmt(s - c, 2)}。直路总比绕远路短，所以 c 一定比 a 加 b 小。` })}</p>` +
        `<p><strong>${t({ en: "Lengths don't add up, so let's switch: compare areas, not lengths.", zh: "长度对不上，那就换个思路：不比长度，比面积。" })}</strong></p>`;
      else html += `<p class="note">${t({ en: "Press “Straighten the legs” to lay a and b along the ladder.", zh: "按「把直角边拉直」，把 a 和 b 沿梯子摆直。" })}</p>`;
    }
  } else if (step === 2) {
    if (u === 0) html += `<p>${t({ en: "A space is left in the middle, and all four of its sides are the long side c. Every corner is ninety degrees, so it's a square, and its area is c squared.", zh: "中间空出了一块，它的四条边都是斜边 c。每个角都是九十度，所以它是正方形，面积就是 c 方。" })}</p>` +
      `<p>${t({ en: "Keep the big square still and pair up the triangles into rectangles. What will the empty space become?", zh: "大正方形不动，把三角形两两拼成长方形，空白会变成什么？" })}</p>`;
    const opts = [{ en: "two squares", zh: "两个正方形" }, { en: "one smaller square", zh: "一个小一点的正方形" }, { en: "no space left", zh: "没有空白了" }];
    html += `<div class="choices">` + opts.map((o, i) => `<button data-p="${i}" class="${predict === i ? (u === 1 ? (i === 0 ? "right" : "wrong") : "on") : ""}">${t(o)}</button>`).join("") + `</div>`;
    if (u === 1) html += `<p>${t({ en: "The empty space becomes two squares, with area a squared plus b squared.", zh: "空白变成两个正方形，面积是 a 方加 b 方。" })} ` +
      `<strong>${t({ en: "The big square didn't change and the triangles didn't change, so the empty area can't change either.", zh: "大正方形没变，三角形也没变，空白的面积就不会变。" })}</strong></p>`;
    html += `<div class="mathline">${s}² − 4 × ${a}×${b}/2 = ${s * s} − ${2 * a * b} = <b>${s * s - 2 * a * b}</b><br>` +
      `${sp("kc", "c²")} = ${sp("kc", c2)} &nbsp; ${sp("ka", "a²")} + ${sp("kb", "b²")} = ${sp("ka", a * a)} + ${sp("kb", b * b)} = ${c2}</div>`;
    if (stats(tris(a, b, 90, P), s).ov > 0) html += `<p><span class="tag-no">${t({ en: "Two triangles overlap: slide that one all the way, or move the one in its path first.", zh: "两个三角形压住了：把它挪到底，或者先挪开挡路的那个。" })}</span></p>`;
  } else if (step === 3) {
    const m = c2Of(th), st = stats(tris(a, b, th, P), s);
    if (th > 90) {
      const out = st.out > 0, ov = st.ov > 0;
      const what = out && ov ? { en: "The triangles poke out of the square and overlap. Nothing fits.", zh: "三角形戳出了大正方形，互相压住，拼不起来。" }
        : out ? { en: "The triangles poke out of the square. Nothing fits.", zh: "三角形戳出了大正方形，拼不起来。" }
        : { en: "The triangles overlap. Nothing fits.", zh: "三角形互相压住，拼不起来。" };
      html += `<p><span class="tag-no">${t(what)}</span></p>` +
        `<p>${t({ en: "Now the long side is longer, and c squared is bigger than a squared plus b squared.", zh: "斜边变长了，所以 c 方比 a 方加 b 方还要大。" })}</p>` +
        `<div class="mathline">${sp("kc", "c²")} ≈ <span class="kn">${fmt(m, 2)}</span> &nbsp;&gt;&nbsp; ${sp("ka", "a²")} + ${sp("kb", "b²")} = ${c2}</div>`;
      if (!ov && u !== 1) html += `<p class="note">${t({ en: "Now press “Pair them up”: in the rectangles they overlap too.", zh: "再按「两两拼成长方形」：拼长方形时它们也会压住。" })}</p>`;
    } else html += `<div class="mathline">${th}°: ${sp("kc", "c²")} = ${c2} = ${sp("ka", "a²")} + ${sp("kb", "b²")}</div>`;
  } else {
    html += `<div class="mathline">${term("a2", "ka", "a²")} + ${term("b2", "kb", "b²")} = ${term("c2", "kc", "c²")}<br>` +
      `${term("a2", "ka", `${a}²`)} + ${term("b2", "kb", `${b}²`)} = ${a * a} + ${b * b} = ${term("c2", "kc", c2)}<br>c = ${cTxt(c2)}</div>`;
    if (a === 3 && b === 4) html += `<p><strong>${t({ en: "Short sides three and four: nine plus sixteen is twenty-five, so the long side is five, not seven.", zh: "直角边三和四：九加十六是二十五，斜边是五，不是七。" })}</strong></p>`;
    else html += `<p>${t({ en: `So if the short sides are three and four, how long is the long side? Press “3 and 4”. The ladder here needs only ${fmt(c, 2)}, not ${s}.`, zh: `两条直角边是三和四时斜边是多少？按「三和四」。这里的梯子只要 ${fmt(c, 2)}，不是 ${s}。` })}</p>`;
  }
  $("explain").innerHTML = html;
  // the ladder is often wide and flat: fit the canvas height to it instead of leaving a blank band
  if (step === 1) {
    const bx = ladderBox(), W = cv.getBoundingClientRect().width || 600, H0 = innerWidth <= 560 ? 350 : 420;
    cv.style.height = Math.round(clamp((W - 84) * (bx[3] - bx[1]) / (bx[2] - bx[0]) + 106, 240, H0)) + "px";
  } else cv.style.height = "";
  $("vtitle").textContent = t(D["v" + step]);
  $("vtag").textContent = t(D["tag" + step]);
  cv.setAttribute("aria-label", step === 3 ? `${th}°, c² ≈ ${fmt(c2Of(th), 2)}, a² + b² = ${c2}` : `a = ${a}, b = ${b}, a² + b² = ${a * a} + ${b * b} = ${c2} = c²`);
  const mb = $("mainBtn");
  if (step === 1) mb.textContent = t(k !== kTo ? D.pause : k > 0.5 ? D.bendBack : D.straight);
  else mb.textContent = t(moving ? D.pause : P.some((v, i) => Math.abs(v - tg[i]) > EPS) ? D.cont : u === 1 ? D.toC : D.toRect);
  $("b34").hidden = step !== 4; $("b34").classList.toggle("on", a === 3 && b === 4);
  $("angRow").hidden = step !== 3; $("b90").hidden = step !== 3;
  $("ang").value = th; $("angVal").textContent = th + "°";
  $("aVal").textContent = a; $("bVal").textContent = b;
  dirty = true;
}
$("explain").addEventListener("click", (ev) => {
  const g = ev.target.closest("[data-g]"), q = ev.target.closest("[data-p]"), kk = ev.target.closest("[data-sel]");
  if (g) { guess = +g.dataset.g; if (k === 0 && kTo === 0) { kTo = 1; if (Play.reduced) k = 1; } }
  if (q) { predict = +q.dataset.p; if (uni() !== 1) layoutTo(1); }
  if (kk) {
    const key = kk.dataset.sel; sel = sel === key ? null : key;
    if (sel === "c2" && uni() !== 0) layoutTo(0);
    if ((sel === "a2" || sel === "b2") && uni() !== 1) layoutTo(1);
  }
  if (g || q || kk) render();
});

// ---------- actions ----------
function layoutTo(L) {
  tg = [L, L, L, L]; tg[0] = 0;
  if (Play.reduced) { P = tg.slice(); moving = false; } else moving = true;
  render();
}
function mainClick() {
  if (step === 1) {
    if (k !== kTo) kTo = k; else { kTo = k > 0.5 ? 0 : 1; if (Play.reduced) k = kTo; }
    return render();
  }
  if (moving) { moving = false; return render(); }
  if (P.some((v, i) => Math.abs(v - tg[i]) > EPS)) { if (Play.reduced) P = tg.slice(); else moving = true; return render(); }
  layoutTo(uni() === 1 ? 0 : 1);
}
function setAB(na, nb) {
  na = clamp(na, 1, MAXS); nb = clamp(nb, 1, MAXS);
  if (na === a && nb === b) return;
  a = na; b = nb; render();
}
function setTh(v) { th = clamp(Math.round(v), 90, 150); render(); }
$("mainBtn").onclick = mainClick;
$("b34").onclick = () => setAB(3, 4);
$("b90").onclick = () => setTh(90);
$("ang").oninput = (e) => setTh(+e.target.value);
document.querySelectorAll("[data-d]").forEach((bt) => (bt.onclick = () => {
  const d = bt.dataset.d[1] === "+" ? 1 : -1;
  if (bt.dataset.d[0] === "a") setAB(a + d, b); else setAB(a, b + d);
}));
const nav = Play.steps(document.querySelector(".steps"), (s) => {
  step = s; sel = null;
  if (s === 1 && Play.reduced) k = kTo;
  render();
});

const inTri = (pt, tr) => {
  const sd = (p, q, r) => (q[0] - p[0]) * (r[1] - p[1]) - (q[1] - p[1]) * (r[0] - p[0]);
  const d1 = sd(tr[0], tr[1], pt), d2 = sd(tr[1], tr[2], pt), d3 = sd(tr[2], tr[0], pt);
  return (d1 >= 0 && d2 >= 0 && d3 >= 0) || (d1 <= 0 && d2 <= 0 && d3 <= 0);
};
Play.drag(cv, {
  down(px, py) {
    if (!geo) return false;
    const near = (q) => q && Math.hypot(px - q[0], py - q[1]) < 22;
    const g = geo;
    if (step === 1) { grab = near(g.F) ? { k: "F", g } : near(g.T) ? { k: "T", g } : null; return grab; }
    if (near(g.H)) { grab = { k: step === 3 ? "ang" : "split", g }; return grab; }
    if (step === 3) return false;
    const pt = [g.U(px), g.V(py)];
    for (let i = 3; i >= 1; i--) if (inTri(pt, g.T[i])) { grab = { k: "tri", i, g }; moving = false; return grab; }
    if (step === 4) {   // tap an empty piece
      const u = uni(), s = a + b;
      let key = null;
      if (u === 0 && !g.T.some((tr) => inTri(pt, tr)) && pt[0] > 0 && pt[0] < s && pt[1] > 0 && pt[1] < s) key = "c2";
      if (u === 1) key = pt[0] < a && pt[1] > b && pt[1] < s && pt[0] > 0 ? "a2" : pt[0] > a && pt[0] < s && pt[1] < b && pt[1] > 0 ? "b2" : null;
      if (key) { sel = sel === key ? null : key; render(); }
    }
    return false;
  },
  move(px, py, dx, dy) {
    if (!grab) return;
    const g = grab.g;
    if (grab.k === "F") setAB(Math.round(-g.U(px)), b);
    else if (grab.k === "T") setAB(a, Math.round(g.V(py)));
    else if (grab.k === "split") { const s = a + b, na = clamp(Math.round(g.U(px)), 1, s - 1); if (s - na <= MAXS && na <= MAXS) setAB(na, s - na); }
    else if (grab.k === "ang") { const phi = Math.atan2(g.V(py), g.U(px)) / RAD; setTh(2 * (phi - 45)); }
    else if (grab.k === "tri") {
      const tr = TRANS()[grab.i], Dx = tr[0] * g.p, Dy = -tr[1] * g.p, L2 = Dx * Dx + Dy * Dy;
      if (L2 > 0) { P[grab.i] = clamp(P[grab.i] + (dx * Dx + dy * Dy) / L2, 0, 1); dirty = true; }
    }
  },
  up() {
    if (grab && grab.k === "tri") {
      const i = grab.i; tg[i] = Math.round(P[i]);
      if (Play.reduced) P[i] = tg[i]; else moving = true;
      render();
    }
    grab = null;
  },
});
Play.keys(cv, {
  ArrowLeft: () => (step === 3 ? setTh(th - 5) : step === 1 ? setAB(a - 1, b) : setAB(a - 1, b + 1)),
  ArrowRight: () => (step === 3 ? setTh(th + 5) : step === 1 ? setAB(a + 1, b) : setAB(a + 1, b - 1)),
  ArrowUp: () => (step === 3 ? setTh(th + 5) : setAB(a, b + 1)),
  ArrowDown: () => (step === 3 ? setTh(th - 5) : setAB(a, b - 1)),
  Enter: mainClick, " ": mainClick,
});
$("reset").onclick = () => {
  a = A0; b = B0; guess = -1; k = kTo = 0; P = [0, 0, 0, 0]; tg = [0, 0, 0, 0]; moving = false; predict = -1; th = 90; sel = null;
  nav.set(1);
};
Play.onTheme(() => (dirty = true));
window.addEventListener("resize", () => { if (step === 1) render(); dirty = true; });

// forward: top-right, top-left, then bottom-right (each target spot is empty when it moves); backward in reverse
const ORDER_F = [2, 3, 1], ORDER_B = [1, 3, 2];
Play.loop((dt) => {
  if (k !== kTo) {
    k = clamp(k + Math.sign(kTo - k) * dt / 1.1, 0, 1);
    if (Math.abs(k - kTo) < 1e-3) { k = kTo; render(); }
    dirty = true;
  }
  if (moving) {
    const fwd = [1, 2, 3].some((i) => tg[i] > P[i] + EPS), order = fwd ? ORDER_F : ORDER_B;
    const i = order.find((j) => Math.abs(P[j] - tg[j]) > EPS);
    if (i === undefined) { moving = false; render(); }
    else { P[i] = clamp(P[i] + Math.sign(tg[i] - P[i]) * dt / 0.6, Math.min(P[i], tg[i]), Math.max(P[i], tg[i])); if (Math.abs(P[i] - tg[i]) < EPS) P[i] = tg[i]; }
    dirty = true;
  }
  if (dirty) { dirty = false; main.redraw(); }
});
nav.set(1);
</script>
</body>
</html>
