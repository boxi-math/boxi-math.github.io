<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Completing the Square, Literally · Boxi Math</title>
<link rel="stylesheet" href="play.css">
<script src="play.js"></script>
<style>
  .stepper { display: inline-flex; align-items: center; gap: 6px; }
  .stepper b { font-family: var(--math); font-size: 20px; min-width: 1.6em; text-align: center; color: var(--fg); }
  .stepper .lab { font-family: var(--math); font-style: italic; font-size: 18px; font-weight: 700; }
  .controls button { min-height: 40px; min-width: 40px; font-size: 15px; }
  .controls .big { font-weight: 700; padding: 7px 16px; }
  .controls button.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .choices button { min-height: 40px; font-weight: 650; font-family: var(--math); font-size: 16px; }
  .choices button.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .cA { color: var(--a); font-weight: 700; }
  .cC { color: var(--c); font-weight: 700; }
  .cH { color: var(--hl); font-weight: 700; }
  .cN { color: var(--no); font-weight: 700; }
  .mathline b { color: var(--fg); }
  .strike { text-decoration: line-through; text-decoration-thickness: 2px; }
  .presets { display: inline-flex; gap: 6px; flex-wrap: wrap; }
  .presets button { font-family: var(--math); }
</style>
</head>
<body>
<main class="play">
  <div class="topline"><span class="eyebrow" data-t="eyebrow"></span><span class="langs"><a class="langlink" href="?lang=zh">中文</a></span></div>
  <h1 data-t="title"></h1>
  <p class="intro" data-t="intro"></p>

  <div class="navrow">
    <nav class="steps" aria-label="steps">
      <button data-step="1"><span class="k">01</span><span data-t="s1"></span></button>
      <button data-step="2"><span class="k">02</span><span data-t="s2"></span></button>
      <button data-step="3"><span class="k">03</span><span data-t="s3"></span></button>
    </nav>
    <div class="tools"><button class="small" id="reset" data-t="reset"></button></div>
  </div>

  <section class="stage">
    <div class="visual">
      <div class="vtitle" id="vtitle"></div><div class="vtag" id="vtag"></div>
      <canvas class="main" id="main" tabindex="0" aria-label="a square x by x with a strip b wide"></canvas>
      <div class="controls">
        <span class="stepper"><span class="lab cA">x</span><button data-d="x-" aria-label="x minus">−</button><b id="xVal"></b><button data-d="x+" aria-label="x plus">+</button></span>
        <span class="stepper"><span class="lab cC">b</span><button data-d="b-" aria-label="b minus">−</button><b id="bVal"></b><button data-d="b+" aria-label="b plus">+</button></span>
      </div>
      <div class="controls" id="c1">
        <button class="big" id="b2Btn"></button>
      </div>
      <div class="controls" id="c2" hidden>
        <button class="big" id="moveBtn"></button>
        <button class="big" id="fillBtn"></button>
        <button class="big" id="tryBtn"></button>
      </div>
      <div class="controls" id="c3" hidden>
        <span class="presets"><button data-p="5,4">x² + 4x = 45</button><button data-p="2,6">x² + 6x = 16</button><button data-p="2,8">x² + 8x = 20</button><button data-p="4,2">x² + 2x = 24</button></span>
      </div>
    </div>
    <div class="explain" id="explain" aria-live="polite"></div>
  </section>

  <section class="result">
    <div><div class="rt" data-t="resT"></div><div class="math" id="resMath"></div></div>
    <div class="rn" data-t="resN"></div>
  </section>
  <details class="more"><summary data-t="moreS"></summary><p data-t="moreP"></p></details>
  <p class="foot" data-t="foot"></p>
</main>
<script>
"use strict";
const { t, color, rgba, clamp } = Play;
const F = (v) => Play.fmt(v, 2);
const D = {
  title: { en: "Completing the Square, Literally", zh: "配方：把矩形补成正方形" },
  eyebrow: { en: "Boxi Math · Try it · #23", zh: "Boxi Math · 动手试试 · #23" },
  intro: { en: "x² + 4x = 45. With no formula, where would you start? Draw x squared as a square with side x and four x as a strip four wide, then try to make the whole thing into a square. Each grid square is 1 unit².",
           zh: "x² + 4x = 45，要是没有公式，你从哪下手？把 x 方画成边长 x 的正方形，四 x 画成宽四的长条，再想办法把整块补成正方形。每个小方格面积是 1。" },
  s1: { en: "Add b²?", zh: "补 b²？" }, s2: { en: "Split and move", zh: "对半分，挪一半" }, s3: { en: "Solve it", zh: "解出 x" },
  reset: { en: "Reset", zh: "重置" }, pause: { en: "Pause", zh: "暂停" },
  b2On: { en: "Add b² in the corner", zh: "角上补一个 b²" }, b2Off: { en: "Take b² away", zh: "拿走 b²" },
  move: { en: "Split and move", zh: "切开，挪上去" }, back: { en: "Put it back", zh: "放回去" },
  fill: { en: "Fill the corner", zh: "补上角" }, unfill: { en: "Empty the corner", zh: "拿走角块" },
  tryOn: { en: "Try b² instead", zh: "换成 b² 试试" }, tryOff: { en: "Hide b²", zh: "收起 b²" },
  v1: { en: "Add b² in the corner?", zh: "角上补 b²？" }, v2: { en: "Cut the strip in half", zh: "长条对半切开" }, v3: { en: "Picture and equation", zh: "图和方程" },
  tag1: { en: "drag the strip's edge", zh: "拖动长条的边" }, tag2: { en: "drag the right-hand half", zh: "拖动右边那一半" }, tag3: { en: "change x and b", zh: "改一改 x 和 b" },
  resT: { en: "Split the strip in half and move one half to the top: only a corner with side b over two is missing. Fill it and you have a square.",
          zh: "长条对半分，一半挪到上面，就只差一个边长二分之 b 的角；补上它就是正方形。" },
  resN: { en: "The corner is b over two, squared, not b squared. Take the square root and you have x: that's where the quadratic formula comes from.",
          zh: "补的角是二分之 b 的平方，不是 b 方。开个方就解出 x，求根公式就是这样推出来的。" },
  moreS: { en: "How does this give the quadratic formula?", zh: "求根公式是怎么从这里来的？" },
  moreP: { en: "Swap four for any b and you always add b over two, squared: x² + bx = c becomes (x + b/2)² = c + (b/2)², so x = −b/2 ± √(c + (b/2)²). For ax² + bx + c = 0, divide by a first and do the same thing; tidy it up and you get x = (−b ± √(b² − 4ac)) / 2a. The two strips are the 2·(b/2)·x of the square of a sum (#17); cutting and moving never changes the area (#4, #18). Try one: x squared plus six x equals sixteen. How big a corner would you add?",
           zh: "四换成任意的 b，补的都是二分之 b 的平方：x² + bx = c 变成 (x + b/2)² = c + (b/2)²，所以 x = −b/2 ± √(c + (b/2)²)。ax² + bx + c = 0 先两边除以 a，再照做一遍，整理一下就是 x = (−b ± √(b² − 4ac)) / 2a。两条长条就是完全平方公式（#17）里的 2·(b/2)·x；切开、挪一挪，面积不变（#4、#18）。练一练：x 方加六 x 等于十六，你会在角上补多大一块？" },
  foot: { en: "Mouse, touch or keyboard: focus the picture, then ↑ ↓ change x and ← → change b (steps 01 and 03), ← → move the half strip (step 02), Enter plays.",
          zh: "鼠标、触屏、键盘都能用：选中图后，↑ ↓ 改 x、← → 改 b（第 1、3 步），← → 挪半条（第 2 步），回车播放。" },
};
Play.i18n(D);

// script numbers: x = 5, b = 4 (x² + 4x = 45, corner (4/2)² = 4, (5 + 2)² = 49)
const X0 = 5, B0 = 4, XMAX = 12, BMAX = 12;
let step = 1, x = X0, b = B0, guess = -1, b2 = false, predict = -1, filled = false, tryB2 = false;
let u = 0, uTo = null, grab = null, dirty = true, V = null;
const $ = (id) => document.getElementById(id);
const cv = $("main");
const main = Play.canvas(cv, draw);
const h2 = () => b / 2;

// ---------- view: world units (y up) to canvas px ----------
const PAD = { l: 66, r: 74, t: 34, b: 58 };
function box() { const s = step === 3 ? x + h2() : x + b; return [0, s, 0, s]; }
function scaleFor(w, hg, bx) {
  const s = Math.min(46, (w - PAD.l - PAD.r) / Math.max(1, bx[1] - bx[0]));
  return hg ? Math.min(s, (hg - PAD.t - PAD.b) / Math.max(1, bx[3] - bx[2])) : s;
}
function sizeCanvas() {
  const w = cv.clientWidth; if (!w) return;
  const bx = box(), sc = scaleFor(w, 0, bx);
  cv.style.height = Math.round(clamp((bx[3] - bx[2]) * sc + PAD.t + PAD.b, 240, 440)) + "px";
}
function setView(w, hg) {
  const bx = box(), sc = scaleFor(w, hg, bx);
  const bw = (bx[1] - bx[0]) * sc, bh = (bx[3] - bx[2]) * sc;
  const left = PAD.l + (w - PAD.l - PAD.r - bw) / 2, top = PAD.t + (hg - PAD.t - PAD.b - bh) / 2;
  V = { sc, X: (q) => left + (q - bx[0]) * sc, Y: (q) => top + (bx[3] - q) * sc, x: (px) => (px - left) / sc + bx[0] };
}

// ---------- the moving half strip ----------
// right half [x+b/2, x+b]×[0, x] turns a quarter clockwise and lands on [0, x]×[x, x+b/2]
function half(uu) {
  const c0 = [x + 0.75 * b, x / 2], c1 = [x / 2, x + b / 4];
  const s = uu * uu * (3 - 2 * uu), lift = Math.sin(Math.PI * s) * Math.min(b / 4, x / 4);
  return { c: [c0[0] + (c1[0] - c0[0]) * s, c0[1] + (c1[1] - c0[1]) * s + lift], th: (Math.PI / 2) * s, w: h2(), h: x, c0, c1,
    ox: Math.ceil(x + b / 2 - 1e-9) - (x + b / 2) };
}

// ---------- drawing helpers ----------
function rectPath(c, x0, y0, x1, y1) { c.beginPath(); c.rect(V.X(x0), V.Y(y1), (x1 - x0) * V.sc, (y1 - y0) * V.sc); }
// a w×h block (world units) centred at screen (cx, cy), turned clockwise by th; grid lines start ox / oy from its left / top edge
function block(c, cx, cy, w, h, th, col, alpha, ox, oy, dash) {
  if (w < 1e-6 || h < 1e-6) return;
  const W = w * V.sc, H = h * V.sc, C = color(col);
  c.save(); c.translate(cx, cy); c.rotate(th);
  c.fillStyle = color("--surface"); c.fillRect(-W / 2, -H / 2, W, H);
  c.fillStyle = rgba(C, alpha); c.fillRect(-W / 2, -H / 2, W, H);
  if (V.sc >= 10) {
    c.strokeStyle = rgba(C, 0.38); c.lineWidth = 1; c.beginPath();
    for (let k = ox || 0; k < w - 1e-6; k++) if (k > 1e-6) { c.moveTo(-W / 2 + k * V.sc, -H / 2); c.lineTo(-W / 2 + k * V.sc, H / 2); }
    for (let k = oy || 0; k < h - 1e-6; k++) if (k > 1e-6) { c.moveTo(-W / 2, -H / 2 + k * V.sc); c.lineTo(W / 2, -H / 2 + k * V.sc); }
    c.stroke();
  }
  c.strokeStyle = C; c.lineWidth = 2.2; if (dash) c.setLineDash([7, 5]); c.strokeRect(-W / 2, -H / 2, W, H); c.setLineDash([]);
  c.restore();
}
function blockW(c, x0, y0, x1, y1, col, alpha, dash) {
  block(c, V.X((x0 + x1) / 2), V.Y((y0 + y1) / 2), x1 - x0, y1 - y0, 0, col, alpha, Math.ceil(x0 - 1e-9) - x0, y1 - Math.floor(y1 + 1e-9), dash);
}
function fits(c, s, wpx, hpx, size) { c.font = `700 ${size}px Inter, system-ui, sans-serif`; return c.measureText(s).width + 10 < wpx && size + 6 < hpx; }
function inLabel(c, s, x0, y0, x1, y1, col) {   // centred label inside a world rect, only if it fits
  const w = (x1 - x0) * V.sc, h = (y1 - y0) * V.sc;
  if (fits(c, s, w, h, 15)) { Play.text(c, s, V.X((x0 + x1) / 2), V.Y((y0 + y1) / 2), { size: 15, weight: 700, color: col }); return true; }
  return false;
}
function inLabel2(c, a, bb, x0, y0, x1, y1, col) { if (!inLabel(c, a, x0, y0, x1, y1, col)) inLabel(c, bb, x0, y0, x1, y1, col); }
const lbl = (c, s, X, Y, col, align) => Play.text(c, s, X, Y, { size: 15, weight: 700, color: col || color("--fg"), align: align || "center" });
function sideL(c, s, y0, y1, col) { if ((y1 - y0) * V.sc >= 16) lbl(c, s, V.X(0) - 8, V.Y((y0 + y1) / 2), col, "right"); }
function sideR(c, s, xr, y0, y1, col) { c.font = "700 15px Inter, system-ui, sans-serif"; if ((y1 - y0) * V.sc >= 16 && V.X(xr) + 12 + c.measureText(s).width < c.canvas.clientWidth) lbl(c, s, V.X(xr) + 8, V.Y((y0 + y1) / 2), col, "left"); }
function under(c, s, x0, x1, col) { c.font = "700 15px Inter, system-ui, sans-serif"; if (c.measureText(s).width + 4 < (x1 - x0) * V.sc || x1 - x0 >= x) lbl(c, s, V.X((x0 + x1) / 2), V.Y(0) + 20, col); }
function bracket(c, x0, x1, s, col) {   // bracket under [x0, x1] with a label
  const yb = V.Y(0) + 36; c.strokeStyle = col || color("--fg"); c.lineWidth = 1.4; c.beginPath();
  c.moveTo(V.X(x0), yb - 4); c.lineTo(V.X(x0), yb); c.lineTo(V.X(x1), yb); c.lineTo(V.X(x1), yb - 4); c.stroke();
  lbl(c, s, V.X((x0 + x1) / 2), yb + 13, col);
}
function hatch(c, x0, y0, x1, y1, col) {
  c.save(); rectPath(c, x0, y0, x1, y1); c.clip();
  c.strokeStyle = rgba(col, 0.35); c.lineWidth = 1; c.beginPath();
  const W = (x1 - x0) * V.sc, H = (y1 - y0) * V.sc;
  for (let k = -H; k < W; k += 9) { c.moveTo(V.X(x0) + k, V.Y(y0)); c.lineTo(V.X(x0) + k + H, V.Y(y1)); }
  c.stroke(); c.restore();
  rectPath(c, x0, y0, x1, y1); c.strokeStyle = col; c.lineWidth = 2.4; c.setLineDash([7, 5]); c.stroke(); c.setLineDash([]);
}
function knob(c, X, Y) {
  c.fillStyle = color("--hl"); c.beginPath(); c.arc(X, Y, 11, 0, 2 * Math.PI); c.fill();
  c.strokeStyle = color("--surface"); c.lineWidth = 2; c.beginPath();
  c.moveTo(X - 6, Y); c.lineTo(X + 6, Y); c.moveTo(X - 3, Y - 3); c.lineTo(X - 6, Y); c.lineTo(X - 3, Y + 3);
  c.moveTo(X + 3, Y - 3); c.lineTo(X + 6, Y); c.lineTo(X + 3, Y + 3); c.stroke();
}

// ---------- step 1: x² + bx, then b² in the corner ----------
function draw1(c) {
  const NO = color("--no"), A = color("--a"), C = color("--c");
  blockW(c, 0, 0, x, x, "--a", 0.22);
  blockW(c, x, 0, x + b, x, "--c", 0.24);
  inLabel2(c, `x² = ${x * x}`, "x²", 0, 0, x, x, A);
  inLabel2(c, `${b}x = ${b * x}`, `${b * x}`, x, 0, x + b, x, C);
  if (b2) {
    c.strokeStyle = color("--muted"); c.lineWidth = 1.6; c.setLineDash([4, 4]); rectPath(c, 0, 0, x + b, x + b); c.stroke(); c.setLineDash([]);
    blockW(c, x, x, x + b, x + b, "--no", 0.2);
    inLabel2(c, `b² = ${b * b}`, `${b * b}`, x, x, x + b, x + b, NO);
    hatch(c, 0, x, x, x + b, NO);
    inLabel2(c, `${t({ en: "missing", zh: "还缺" })} ${b * x}`, `${b * x}`, 0, x, x, x + b, NO);
    sideR(c, "b", x + b, x, x + b, NO);
    sideL(c, "b", x, x + b, NO);
  }
  under(c, `x = ${x}`, 0, x, A); under(c, `b = ${b}`, x, x + b, C);
  sideL(c, `x = ${x}`, 0, x, A);
  if (b2) bracket(c, 0, x + b, `x + b = ${x + b}`);
  knob(c, V.X(x + b), V.Y(x / 2));
}

// ---------- steps 2 and 3: split, move, fill ----------
function drawSplit(c, uu, full) {
  const H = h2(), S = half(uu), done = uu > 1 - 1e-3, HL = color("--hl"), A = color("--a"), C = color("--c"), NO = color("--no");
  blockW(c, 0, 0, x, x, "--a", 0.22);
  blockW(c, x, 0, x + H, x, "--c", 0.24);
  block(c, V.X(S.c[0]), V.Y(S.c[1]), S.w, S.h, S.th, "--c", 0.24, S.ox, 0);
  inLabel2(c, `x² = ${x * x}`, "x²", 0, 0, x, x, A);
  inLabel2(c, `${F(H)}x`, "", x, 0, x + H, x, C);
  if (uu < 1e-3) {
    c.strokeStyle = HL; c.lineWidth = 3; c.setLineDash([8, 5]); c.beginPath();
    c.moveTo(V.X(x + H), V.Y(x) - 12); c.lineTo(V.X(x + H), V.Y(0) + 6); c.stroke(); c.setLineDash([]);
    inLabel2(c, `${F(H)}x`, "", x + H, 0, x + b, x, C);
    under(c, `x = ${x}`, 0, x, A);
    under(c, F(H), x, x + H, C); under(c, F(H), x + H, x + b, C);
    bracket(c, x, x + b, `b = ${b}`, C);
    sideL(c, `x = ${x}`, 0, x, A);
  } else if (done) {
    inLabel2(c, `${F(H)}x`, "", 0, x, x, x + H, C);
    if (filled) {
      blockW(c, x, x, x + H, x + H, "--hl", 0.45);
      inLabel2(c, `(b/2)² = ${F(H * H)}`, F(H * H), x, x, x + H, x + H, color("--fg"));
      c.strokeStyle = HL; c.lineWidth = 3.5; rectPath(c, 0, 0, x + H, x + H); c.stroke();
    } else {
      c.strokeStyle = HL; c.lineWidth = 2.4; c.setLineDash([6, 4]); rectPath(c, x, x, x + H, x + H); c.stroke(); c.setLineDash([]);
      if (H * V.sc > 18) lbl(c, "?", V.X(x + H / 2), V.Y(x + H / 2), HL);
    }
    if (tryB2) {
      c.save(); c.globalAlpha = 0.85; blockW(c, x, x, x + b, x + b, "--no", 0.16, true); c.restore();
      inLabel2(c, `b² = ${b * b}`, `${b * b}`, x + H, x + H, x + b, x + b, NO);
      sideR(c, "b", x + b, x, x + b, NO);
    }
    under(c, `x = ${x}`, 0, x, A); under(c, F(H), x, x + H, C);
    sideL(c, `x = ${x}`, 0, x, A); sideL(c, `${F(H)}`, x, x + H, C);
    if (filled || full) {
      bracket(c, 0, x + H, `x + b/2 = ${F(x + H)}`, color("--fg"));
      if (!tryB2) sideR(c, `x + b/2 = ${F(x + H)}`, x + H, 0, x + H, color("--fg"));
    }
  }
}

function draw(c, w, hg) {
  setView(w, hg);
  if (step === 1) draw1(c);
  else drawSplit(c, u, step === 3);
}

// ---------- text ----------
const sp = (cls, s) => `<span class="${cls}">${s}</span>`;
function render() {
  const H = h2(), Q = H * H, N = x * x + b * x, S = x + H;
  if (step === 3) { u = 1; uTo = null; filled = true; tryB2 = false; }
  let html = "";
  if (step === 1) {
    const opts = [[`b² = ${b * b}`, 0], [`(b/2)² = ${F(Q)}`, 1], [`2b = ${2 * b}`, 2]];
    html += `<div class="kicker">${t({ en: "Step 01 · test the guess", zh: "第 1 步 · 先试试那个说法" })}</div>` +
      `<h2>${t({ en: "x squared is a square with side x, and b x is a strip b wide. What would you add in the corner to make a square?", zh: "x 方是边长 x 的正方形，b x 是宽 b 的长条。角上补多大一块，能补成正方形？" })}</h2><div class="choices">` +
      opts.map(([s, g]) => `<button data-g="${g}" class="${guess === g ? "on" : ""}">${s}</button>`).join("") + `</div>`;
    if (guess >= 0 && !b2) html += `<p>${t({ en: "Your deskmate shakes their head: you need the quadratic formula, memorised and plugged in. Let's look at the picture instead. First try adding b squared in the corner and see if it makes a square.", zh: "同桌直摇头：这得背求根公式，套进去才算得出。我们还是看图。先试试在角上补一个 b 方，看能不能补成正方形。" })}</p>`;
    if (b2) {
      html += `<p>${t({ en: "But a square with side x plus b still has a big empty piece at the top left.", zh: "可是边长 x 加 b 的正方形，左上角还空着一大块。" })}</p>` +
        `<div class="mathline">x² + ${b}x + b² = ${x * x} + ${b * x} + ${b * b} = <b>${N + b * b}</b><br>` +
        `(x + b)² = ${x + b}² = <b>${(x + b) * (x + b)}</b><br>` +
        `${sp("cN", `${t({ en: "missing", zh: "还缺" })}: ${x} × ${b} = ${b * x}`)}</div>` +
        `<p><span class="tag-no">${t({ en: "Not a square.", zh: "补不成正方形。" })}</span> ${t({ en: "Remember from before: that square has two strips in it, and here there's only one. Without splitting the strip, adding b squared still leaves a b x strip missing.", zh: "上一集刚说过，它里面有两条长条，这里只有一条。整条长条不分开，补一个 b 方也还缺一条 b x。" })}</p>` +
        `<p class="note">${t({ en: "Drag the strip's edge or change x and b: the missing strip never goes away. Then go to step 02.", zh: "拖动长条的边，或者改 x 和 b：缺的那一条总在。接着去第 2 步。" })}</p>`;
    } else html += `<p class="note">${t({ en: "Press “Add b² in the corner” to test it.", zh: "按「角上补一个 b²」试一试。" })}</p>`;
  } else if (step === 2) {
    const done = u > 1 - 1e-3;
    const opts = [[`${b} × ${b}`, 0], [`${F(H)} × ${F(H)}`, 1], [`${b} × ${F(H)}`, 2]];
    html += `<div class="kicker">${t({ en: "Step 02 · split and move", zh: "第 2 步 · 对半分，挪一半" })}</div>` +
      `<h2>${t({ en: "Cut the strip into two halves and move one half to the top. How big is the missing corner?", zh: "把长条切成两半，一半挪到上面，缺的角有多大？" })}</h2>`;
    if (!done) {
      html += `<div class="choices">` + opts.map(([s, g]) => `<button data-q="${g}" class="${predict === g ? "on" : ""}">${s}</button>`).join("") + `</div>` +
        `<p>${t({ en: "Cut the strip in half. Each piece is b over two wide", zh: "长条对半切开，每条宽二分之 b" })}: ${b} ÷ 2 = ${F(H)}. ` +
        `${t({ en: "Drag the right-hand piece, or press “Split and move”.", zh: "拖动右边那一条，或者按「切开，挪上去」。" })}</p>`;
    } else {
      html += `<p>${t({ en: "Turn the right-hand piece round and put it on top: three pieces make a square with a corner missing.", zh: "右边一条转过来贴到上面，三块拼成一个缺角的正方形。" })}` +
        (predict === 1 ? ` <strong>${t({ en: "Your prediction was right.", zh: "你猜对了。" })}</strong>` : predict >= 0 ? ` <span class="tag-no">${t({ en: "Not what you guessed!", zh: "跟你猜的不一样！" })}</span>` : "") + `</p>` +
        `<div class="mathline">${t({ en: "corner", zh: "缺角" })}: ${F(H)} × ${F(H)} = ${sp("cH", `(b/2)² = ${F(Q)}`)}</div>`;
      if (filled) html += `<p>${t({ en: "Fill it in, and we have a big square", zh: "补上它，就是一个大正方形" })}: ${t({ en: "side", zh: "边长" })} x + ${F(H)} = ${F(S)}.</p>` +
        `<div class="mathline">${sp("cA", "x²")} + ${sp("cC", `${F(H)}x + ${F(H)}x`)} + ${sp("cH", F(Q))} = ${x * x} + ${b * x} + ${F(Q)} = <b>${F(N + Q)}</b><br>(x + ${F(H)})² = ${F(S)}² = <b>${F(S * S)}</b></div>`;
      else html += `<p class="note">${t({ en: "Press “Fill the corner”.", zh: "按「补上角」。" })}</p>`;
      if (tryB2) html += `<p><span class="tag-no">${t({ en: "Doesn't fit.", zh: "塞不进去。" })}</span> ` +
        `${t({ en: "b squared is", zh: "b 方是" })} ${b} × ${b} = ${b * b}, ${t({ en: "but the gap is only", zh: "角上只空着" })} ${F(H)} × ${F(H)} = ${F(Q)}: ` +
        `${F(b * b)} ÷ ${F(Q)} = ${F((b * b) / Q)}, ${t({ en: "four times too big.", zh: "大了四倍。" })}</p>`;
    }
  } else {
    html += `<div class="kicker">${t({ en: "Step 03 · solve it", zh: "第 3 步 · 解出 x" })}</div>` +
      `<h2>${t({ en: "So x² + bx + (b/2)² equals (x + b/2)²", zh: "所以 x² + bx + (b/2)² 等于 (x + b/2)²" })}</h2>` +
      `<p>${t({ en: "Add the corner to both sides of the equation, then take the square root. Pick an equation or change x and b.", zh: "方程两边都加上角块，再开个方。选一个方程，或者改 x 和 b。" })}</p>` +
      `<div class="mathline">x² + ${b}x = <b>${N}</b><br>` +
      `x² + ${b}x + ${sp("cH", F(Q))} = ${N} + ${sp("cH", F(Q))} = ${F(N + Q)}<br>` +
      `(x + ${F(H)})² = ${F(N + Q)} = ${F(S)} × ${F(S)}<br>` +
      `x + ${F(H)} = ${F(S)} &nbsp;⇒&nbsp; x = ${F(S)} − ${F(H)} = <b>${F(Math.sqrt(N + Q) - H)}</b></div>` +
      `<p>${t({ en: "x plus", zh: "x 加" })} ${F(H)} ${t({ en: "could also be", zh: "也可以是" })} −${F(S)}, ${t({ en: "so", zh: "所以" })} x = −${F(S)} − ${F(H)} = ${F(-Math.sqrt(N + Q) - H)} ${t({ en: "is a solution too; the picture just can't show it.", zh: "也是解，只是图上画不出来。" })}</p>` +
      `<p class="note">${t({ en: "Swap four for any b and you always add b over two, squared. That's how the quadratic formula is derived.", zh: "四换成任意的 b，补的都是二分之 b 的平方，求根公式就是这么推出来的。" })}</p>`;
  }
  $("explain").innerHTML = html;
  $("vtitle").textContent = t(D["v" + step]);
  $("vtag").textContent = t(D["tag" + step]);
  ["c1", "c2", "c3"].forEach((id, i) => ($(id).hidden = i + 1 !== step));
  $("b2Btn").textContent = t(b2 ? D.b2Off : D.b2On); $("b2Btn").classList.toggle("on", b2);
  const done = u > 1 - 1e-3;
  $("moveBtn").textContent = t(uTo != null ? D.pause : done ? D.back : D.move);
  $("fillBtn").textContent = t(filled ? D.unfill : D.fill); $("fillBtn").disabled = !done; $("fillBtn").classList.toggle("on", filled);
  $("tryBtn").textContent = t(tryB2 ? D.tryOff : D.tryOn); $("tryBtn").disabled = !done; $("tryBtn").classList.toggle("on", tryB2);
  $("xVal").textContent = x; $("bVal").textContent = b;
  $("resMath").textContent = `x² + ${b}x + ${F(Q)} = (x + ${F(H)})²`;
  document.querySelectorAll("[data-d]").forEach((bt) => {
    const k = bt.dataset.d;
    bt.disabled = (k === "x-" && x <= 1) || (k === "x+" && x >= XMAX) || (k === "b-" && b <= 1) || (k === "b+" && b >= BMAX);
  });
  sizeCanvas();
  dirty = true;
}
$("explain").addEventListener("click", (e) => {
  const g = e.target.closest("[data-g]"), q = e.target.closest("[data-q]");
  if (g) guess = +g.dataset.g;
  if (q) predict = +q.dataset.q;
  if (g || q) render();
});

// ---------- actions ----------
function setXB(nx, nb) { x = clamp(Math.round(nx), 1, XMAX); b = clamp(Math.round(nb), 1, BMAX); render(); }
function moveClick() {
  if (uTo != null) uTo = null; else uTo = u > 1 - 1e-3 ? 0 : 1;
  if (uTo === 0) { filled = false; tryB2 = false; }
  if (Play.reduced && uTo != null) { u = uTo; uTo = null; }
  render();
}
function setU(v) { u = clamp(v, 0, 1); uTo = null; if (u < 1) { filled = false; tryB2 = false; } dirty = true; }
function snap() {
  const to = u > 0.5 ? 1 : 0;
  if (Play.reduced || Math.abs(u - to) < 0.02) { u = to; uTo = null; } else uTo = to;
  render();
}

const nav = Play.steps(document.querySelector(".steps"), (n) => {
  if (step === 3 && n === 2) { filled = true; }
  step = n;
  render();
});
$("b2Btn").onclick = () => { b2 = !b2; render(); };
$("moveBtn").onclick = moveClick;
$("fillBtn").onclick = () => { filled = !filled; render(); };
$("tryBtn").onclick = () => { tryB2 = !tryB2; render(); };
document.querySelectorAll("[data-d]").forEach((bt) => (bt.onclick = () => {
  const k = bt.dataset.d, s = k[1] === "+" ? 1 : -1;
  if (k[0] === "x") setXB(x + s, b); else setXB(x, b + s);
}));
document.querySelectorAll("[data-p]").forEach((bt) => (bt.onclick = () => {
  const [nx, nb] = bt.dataset.p.split(",").map(Number); setXB(nx, nb);
}));

Play.drag(cv, {
  down(px, py) {
    if (!V) return false;
    if (step === 1) {
      const kx = V.X(x + b), inEdge = Math.abs(px - kx) < 16 && py > V.Y(x) - 8 && py < V.Y(0) + 8;
      if (Math.hypot(px - kx, py - V.Y(x / 2)) > 24 && !inEdge) return false;
      grab = "edge"; return true;
    }
    if (step !== 2) return false;
    const S = half(u), cx = V.X(S.c[0]), cy = V.Y(S.c[1]);
    const dx = px - cx, dy = py - cy, c = Math.cos(S.th), s = Math.sin(S.th);
    const lx = c * dx + s * dy, ly = -s * dx + c * dy;   // into the piece's own frame
    if (Math.abs(lx) > (S.w * V.sc) / 2 + 12 || Math.abs(ly) > (S.h * V.sc) / 2 + 12) return false;
    uTo = null; grab = "half"; return true;
  },
  move(px, py, dx, dy) {
    if (grab === "edge") {
      const nb = clamp(Math.round(V.x(px) - x), 1, BMAX);
      if (nb !== b) { b = nb; render(); }
    } else if (grab === "half") {
      const S = half(0), vx = (S.c1[0] - S.c0[0]) * V.sc, vy = -(S.c1[1] - S.c0[1]) * V.sc;
      setU(u + (dx * vx + dy * vy) / (vx * vx + vy * vy || 1));
    }
  },
  up() { if (grab === "half") snap(); grab = null; },
});
const enter = () => (step === 1 ? ((b2 = !b2), render()) : step === 2 ? moveClick() : null);
Play.keys(cv, {
  ArrowLeft: () => (step === 2 ? (setU(u - 0.125), render()) : setXB(x, b - 1)),
  ArrowRight: () => (step === 2 ? (setU(u + 0.125), render()) : setXB(x, b + 1)),
  ArrowUp: () => (step !== 2 ? setXB(x + 1, b) : null),
  ArrowDown: () => (step !== 2 ? setXB(x - 1, b) : null),
  Enter: enter, " ": enter,
});
$("reset").onclick = () => {
  x = X0; b = B0; guess = -1; b2 = false; predict = -1; filled = false; tryB2 = false; u = 0; uTo = null;
  step = 1; nav.set(1);
};
Play.onTheme(() => (dirty = true));
window.addEventListener("resize", () => { sizeCanvas(); dirty = true; });

Play.loop((dt) => {
  if (uTo != null) {
    const st = dt / 1.6, dd = uTo - u;
    u = Math.abs(dd) <= st ? uTo : u + Math.sign(dd) * st;
    if (u === uTo) { uTo = null; render(); }
    dirty = true;
  }
  if (dirty) { dirty = false; main.redraw(); }
});
nav.set(1);
</script>
</body>
</html>
