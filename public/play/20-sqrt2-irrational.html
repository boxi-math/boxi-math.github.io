const STEP = {
  1: { kicker: { en: "Step 01 · close enough?", zh: "第 1 步 · 差不多就行？" },
       h: { en: "Can the crease be written exactly as a fraction?", zh: "折痕能正好写成一个分数吗？" } },
  2: { kicker: { en: "Step 02 · suppose it is", zh: "第 2 步 · 假设可以" },
       h: { en: "Suppose √2 = a/b, with b as small as possible", zh: "假设 √2 = a/b，b 取最小" } },
  3: { kicker: { en: "Step 03 · count the sides", zh: "第 3 步 · 数一数边" },
       h: { en: "Again whole numbers, and smaller", zh: "还是整数，而且更小" } },

Play.i18n(D);

// ---------- state ----------
const R2 = Math.SQRT2, NF = 5;                 // NF = most folds in step 04
const A0 = 7, B0 = 5;                          // script: the near miss seven fifths
const PRESETS = [[7, 5], [17, 12], [41, 29], [99, 70], [707, 500]];
let a = A0, b = B0, step = 1, stance = -1, predict = -1;
let f1 = 0, f1To = 0, f2 = 0, f2To = 0, s4 = 0, s4To = 0, zoom = true;
let V = null, dirty = true, dragging = null, dragK = 0, lastKey = "";
const $ = (id) => document.getElementById(id);
const cv = $("main");
const main = Play.canvas(cv, draw);
const ease = (s) => s * s * (3 - 2 * s);
const SUBD = "₀₁₂₃₄₅₆₇₈₉", sub = (n) => String(n).split("").map((c) => SUBD[+c]).join("");

// ---------- geometry (world: y up; the folded paper is C(0,0), B(1,0), A(0,1)) ----------
const add = (p, q) => [p[0] + q[0], p[1] + q[1]], dif = (p, q) => [p[0] - q[0], p[1] - q[1]];
const mul = (p, s) => [p[0] * s, p[1] * s], dot = (p, q) => p[0] * q[0] + p[1] * q[1];
const lerp = (p, q, s) => [p[0] + (q[0] - p[0]) * s, p[1] + (q[1] - p[1]) * s];
const dist = (p, q) => Math.hypot(p[0] - q[0], p[1] - q[1]);
function foot(p, u, w) { const d = dif(w, u); return add(u, mul(d, dot(dif(p, u), d) / dot(d, d))); }
// isosceles right triangle {R: right angle, P: the corner we bisect, Q: the shared corner}.
// Fold leg PR onto the hypotenuse PQ along the bisector P→Dp: R lands on E with PE = PR, Dp is on RQ.
function foldOf(T) {
  const lPR = dist(T.P, T.R), lPQ = dist(T.P, T.Q), lRQ = dist(T.R, T.Q);
  const E = lerp(T.P, T.Q, lPR / lPQ), Dp = lerp(T.R, T.Q, (lPQ - lPR) / lRQ);
  return { D: Dp, E, F: foot(T.R, T.P, Dp) };
}
const T = [{ R: [0, 0], P: [0, 1], Q: [1, 0] }], F = [];
for (let j = 0; j <= NF; j++) { F.push(foldOf(T[j])); T.push({ R: F[j].E, P: F[j].D, Q: T[j].Q }); }
// the folding corner, s = 0 flat … 1 folded (a half turn about the crease, seen from above)
const flapR = (j, s) => { const f = F[j]; return add(f.F, mul(dif(T[j].R, f.F), Math.cos(Math.PI * s))); };

// whole-number chain: (a, b) → (2b − a, a − b), while it is still a/b between 1 and 2
function chain() {
  const rows = []; let x = a, y = b;
  for (let k = 0; k < 12; k++) {
    const ok = y > 0 && y < x && x < 2 * y;
    rows.push({ k, a: x, b: y, d: x * x - 2 * y * y, ok });
    if (!ok) break;
    [x, y] = [2 * y - x, x - y];
  }
  return rows;
}
function cur4() {
  const k = Math.min(Math.floor(s4 + 1e-9), NF), fr = s4 - k;
  return { k, fr, tt: Math.min(1, fr / 0.6), z: zoom && fr > 0.6 ? ease((fr - 0.6) / 0.4) : 0 };
}

// ---------- view ----------
function fitT(Tj, W, H) {
  const ps = [Tj.R, Tj.P, Tj.Q], xs = ps.map((q) => q[0]), ys = ps.map((q) => q[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const p = Math.min((W - 150) / (x1 - x0), (H - 110) / (y1 - y0));
  return { p, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2 };
}
function layout() {
  const W = cv.clientWidth || 600; let H;
  if (step === 1) {
    const L = clamp(W - 150, 140, 240); H = 44 + L + 134;
    V = { p: L, ox: (W - L) / 2, oy: 44 + L, W, H, sy: 44 + L + 44 };
  } else if (step < 4) {
    const L = clamp(W - 150, 150, 290); H = 46 + L + 66;
    V = { p: L, ox: (W - L) / 2 + 6, oy: 46 + L, W, H };
  } else {
    H = W < 560 ? 330 : 380;
    const { k, z } = cur4(), g0 = fitT(zoom ? T[k] : T[0], W, H), g1 = fitT(zoom ? T[k + 1] : T[0], W, H);
    const p = g0.p * Math.pow(g1.p / g0.p, z), cx = g0.cx + (g1.cx - g0.cx) * z, cy = g0.cy + (g1.cy - g0.cy) * z;
    V = { p, ox: W / 2 - cx * p, oy: H / 2 + 6 + cy * p, W, H, base: fitT(T[0], W, H).p };
  }

}
const S = ([x, y]) => [V.ox + x * V.p, V.oy - y * V.p];
const toWorld = (px, py) => [(px - V.ox) / V.p, (V.oy - py) / V.p];

// ---------- drawing helpers ----------
function poly(x, P, fill, stroke, lw, dash) {
  x.beginPath(); P.forEach((q, i) => { const [sx, sy] = S(q); i ? x.lineTo(sx, sy) : x.moveTo(sx, sy); }); x.closePath();
  if (fill) { x.fillStyle = fill; x.fill(); }
  if (stroke) { x.strokeStyle = stroke; x.lineWidth = lw || 2; x.setLineDash(dash || []); x.lineJoin = "round"; x.stroke(); x.setLineDash([]); }
}
function seg(x, p, q, col, lw, dash) {
  const [a1, b1] = S(p), [a2, b2] = S(q);
  x.strokeStyle = col; x.lineWidth = lw; x.setLineDash(dash || []);
  x.beginPath(); x.moveTo(a1, b1); x.lineTo(a2, b2); x.stroke(); x.setLineDash([]);
}
let placed = [];
// label beside segment pq, on the side away from the world point `away`
function lab(x, p, q, s, away, col, off = 8, size = 15) {
  const [x1, y1] = S(p), [x2, y2] = S(q), mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
  let nx = -(y2 - y1), ny = x2 - x1; const n = Math.hypot(nx, ny) || 1; nx /= n; ny /= n;
  const [ax, ay] = S(away); if ((mx - ax) * nx + (my - ay) * ny < 0) { nx = -nx; ny = -ny; }
  x.font = `700 ${size}px Inter, system-ui, sans-serif`;
  const tw = x.measureText(s).width;
  let e = off + Math.abs(nx) * tw / 2 + Math.abs(ny) * size * 0.62, lx, ly;
  for (let i = 0; i < 4; i++) {           // step further out while it would cover a label already placed
    lx = clamp(mx + nx * e, tw / 2 + 4, V.W - tw / 2 - 4); ly = clamp(my + ny * e, 12, V.H - 12);
    if (!placed.some((r) => Math.abs(r[0] - lx) < (r[2] + tw) / 2 + 14 && Math.abs(r[1] - ly) < size + 3)) break;

}
function rmark(x, c, u, w, col) {
  const [cx, cy] = S(c), [ux, uy] = S(u), [wx, wy] = S(w), k = 10;
  const lu = Math.hypot(ux - cx, uy - cy), lw = Math.hypot(wx - cx, wy - cy);
  if (lu < 40 || lw < 40) return;

function handle(x, q) {

function sig(v) { if (v === 0) return "0"; return fmt(v, clamp(2 - Math.floor(Math.log10(v)), 0, 12)); }

// ---------- step 01: the square sheet and a magnifier on the number line ----------
function drawFold1(x) {
  const G = color("--a"), Cc = color("--c"), HL = color("--hl"), M = color("--muted"), NO = color("--no");
  const A = [0, 1], B = [1, 0], C = [0, 0], c = Math.cos(Math.PI * f1), Qt = [0.5 + 0.5 * c, 0.5 + 0.5 * c];
  poly(x, [C, B, A], rgba(G, 0.26), G, 2.2);
  if (c >= 0) poly(x, [A, Qt, B], rgba(G, 0.26), G, 2.2); else poly(x, [A, Qt, B], rgba(Cc, 0.34), Cc, 2.2);
  seg(x, A, B, HL, f1 >= 1 ? 3.4 : 2, f1 >= 1 ? [] : [7, 5]);
  lab(x, C, B, "1", A, color("--fg"), 8, 16);
  lab(x, C, A, "1", B, color("--fg"), 8, 16);
  if (f1 > 0.9) {
    // the deskmate's ruler along the crease, ticks every 0.1
    const [ax, ay] = S(A), [bx, by] = S(B), len = Math.hypot(bx - ax, by - ay), ux = (bx - ax) / len, uy = (by - ay) / len, nx = 0.7071, ny = -0.7071;
    x.strokeStyle = M; x.lineWidth = 1.2; x.beginPath();
    for (let i = 0; i <= 14; i++) {
      const d = i * 0.1 / R2 * len, l = i % 10 === 0 ? 10 : i % 5 === 0 ? 7 : 4, px = ax + ux * d, py = ay + uy * d;
      x.moveTo(px, py); x.lineTo(px + nx * l, py + ny * l);
    }
    x.stroke();
    lab(x, A, B, t({ en: "crease √2", zh: "折痕 √2" }), C, color("--fg"), 18, 16);
    const [qx, qy] = S(B), s = "1.414?";
    x.font = "700 15px Inter, system-ui, sans-serif";
    Play.text(x, s, Math.min(qx + 10 + x.measureText(s).width / 2, V.W - 30), qy - 22, { color: NO, size: 15, weight: 700 });
  }

  drawStrip(x);
}
function drawStrip(x) {
  const y0 = V.sy, xl = 24, xr = V.W - 24, q = a / b, gap = Math.abs(q - R2), w = Math.max(gap * 1.8, 1e-9), lo = (q + R2) / 2 - w;
  const X = (v) => xl + (v - lo) / (2 * w) * (xr - xl), yl = y0 + 26;
  const M = color("--muted"), HL = color("--hl"), G = color("--a"), NO = color("--no"), FG = color("--fg");
  x.strokeStyle = M; x.lineWidth = 1.5; x.beginPath(); x.moveTo(xl, yl); x.lineTo(xr, yl); x.stroke();
  const n0 = Math.ceil(lo * b), n1 = Math.floor((lo + 2 * w) * b);
  if (n1 - n0 < 60) { x.beginPath(); for (let n = n0; n <= n1; n++) { const px = X(n / b); x.moveTo(px, yl - 5); x.lineTo(px, yl + 5); } x.stroke(); }
  const xq = X(q), xs = X(R2);

  put(`${a}/${b} = ${fmt(q, 6)}`, xq, yl + 24, G);

  Play.text(x, t({ en: "zoom ×", zh: "放大 ×" }) + (Z >= 1 ? Math.round(Z) : fmt(Z, 3)), xl, yl + 50, { color: M, size: 13, align: "left", halo: false });

}
function drawTri(x) {

      lab(x, T0.R, T0.Q, "b", T0.P, FG, 8, 17);
      lab(x, T0.P, flapR(0, tt), "b", f.D, FG, 8, 17);
      if (tt < 0.6) lab(x, T0.P, T0.Q, "a", T0.R, FG, 8, 17);
      if (tt >= 1) lab(x, f.E, T0.Q, "a − b", T0.R, Bc, 8, 17);
      handle(x, flapR(0, tt));
    } else {
      lab(x, T0.R, T0.P, `b = ${b}`, T0.Q, M, 8, 15);
      lab(x, T0.P, f.E, `b = ${b}`, T0.R, FG, 8, 15);
      lab(x, f.E, T0.Q, `a − b = ${fmt(a - b, 0)}`, T0.R, Bc, 8, 15);
      lab(x, f.D, f.E, "a − b", T0.Q, Bc, 8, 15);
      lab(x, T0.R, f.D, `a − b = ${fmt(a - b, 0)}`, T0.P, Bc, 6, 15);

    lab(x, Tc.R, Tc.Q, `b${sub(ci)} = ${r ? fmt(r.b, 0) : "?"}`, Tc.P, col, 8, 15);
    lab(x, Tc.P, Tc.Q, `a${sub(ci)} = ${r ? fmt(r.a, 0) : "?"}`, Tc.R, col, 8, 15);
