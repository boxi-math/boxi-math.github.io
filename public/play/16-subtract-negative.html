<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Why Subtracting a Negative Means Adding · Boxi Math</title>
<link rel="stylesheet" href="play.css">
<script src="play.js"></script>
<style>
  .controls button { min-height: 40px; }
  .controls button.on, .choices button.on, .rows button.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .choices button { min-height: 40px; min-width: 56px; font-family: var(--math); font-size: 18px; }
  .choices button.ok { border-color: var(--a); box-shadow: inset 0 0 0 2px var(--a); }
  .choices button.bad { border-color: var(--no); box-shadow: inset 0 0 0 2px var(--no); }
  .explain p.big { font-size: 15px; color: var(--fg); }
  .explain .mathline { font-size: 24px; line-height: 1.5; }
  .ca { color: var(--a); font-weight: 700; } .cb { color: var(--b); font-weight: 700; } .cg { color: var(--hl); font-weight: 700; }
  .cn { color: var(--no); font-weight: 700; } .cc { color: var(--c); font-weight: 700; }
  .ans { background: var(--soft); outline: 2px solid var(--hl); border-radius: 6px; padding: 0 5px; }
  .rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; margin: 2px 0 10px; }
  .rows button { font-family: var(--math); font-size: 17px; text-align: left; padding: 5px 9px; min-height: 38px; white-space: nowrap; }
  .rows button.unseen { color: var(--muted); border-style: dashed; }
  .rows button.neg:not(.on) { border-color: var(--b); }
  .controls .lab { margin-right: 2px; }
  @media (max-width: 560px) { .explain .mathline { font-size: 21px; } }
</style>
</head>
<body>
<main class="play">
  <div class="topline"><span class="eyebrow" data-t="eyebrow"></span><span class="langs"><a class="langlink" href="?lang=zh">中文</a></span></div>
  <h1 data-t="title"></h1>
  <p class="intro" data-t="intro"></p>

  <div class="navrow">
    <nav class="steps" aria-label="steps">
      <button data-step="1"><span class="k">01</span><span data-t="s1"></span></button>
      <button data-step="2"><span class="k">02</span><span data-t="s2"></span></button>
      <button data-step="3"><span class="k">03</span><span data-t="s3"></span></button>
    </nav>
    <div class="tools"><button class="small" id="reset" data-t="reset"></button></div>
  </div>

  <section class="stage">
    <div class="visual">
      <div class="vtitle" id="vtitle"></div><div class="vtag" id="vtag"></div>
      <canvas class="main" id="main" aria-label="number line"></canvas>
      <div class="controls" id="c1">
        <button id="phX" data-t="phX"></button><button id="phR" data-t="phR"></button><button id="play"></button>
      </div>
      <div class="controls" id="c2" hidden>
        <span class="lab" data-t="tryT"></span><span id="pre2"></span>
      </div>
      <div class="controls" id="c3" hidden>
        <span class="lab" data-t="tryT"></span><span id="pre3"></span><button id="cmp" data-t="cmpB"></button>
      </div>
    </div>
    <div class="explain" id="explain" aria-live="polite"></div>
  </section>

  <section class="result">
    <div><div class="rt" data-t="resT"></div><div class="math" id="resM"></div></div>
    <div class="rn" data-t="resN"></div>
  </section>
  <details class="more"><summary data-t="moreS"></summary><p data-t="moreP"></p><p data-t="moreR"></p><p data-t="moreQ"></p></details>
  <p class="foot" data-t="foot"></p>
</main>
<script>
"use strict";
const { t, color, rgba, clamp } = Play;
const D = {
  title: { en: "Why Subtracting a Negative Means Adding", zh: "减去一个负数为什么是加" },
  eyebrow: { en: "Boxi Math · Try it · #16", zh: "Boxi Math · 动手试试 · #16" },
  intro: { en: "It was minus two degrees this morning and three at noon. How much did it rise? Walk it on the number line and count the steps.",
           zh: "早上零下二度，中午三度，气温升了几度？在数轴上走一走，数一数格子。" },
  s1: { en: "Xiaoyu's answer", zh: "小宇的答案" }, s2: { en: "How far apart", zh: "相差多少" }, s3: { en: "Past zero", zh: "越过零" },
  reset: { en: "Reset", zh: "重置" },
  phX: { en: "Xiaoyu's 1", zh: "小宇的 1" }, phR: { en: "Count the rise", zh: "数气温升了几格" },
  playB: { en: "▶ Count for me", zh: "▶ 帮我数" }, pauseB: { en: "❚❚ Pause", zh: "❚❚ 暂停" },
  tryT: { en: "Try:", zh: "试试：" }, cmpB: { en: "Compare with +", zh: "和加法比一比" },
  v1: { en: "Thermometer as a number line", zh: "把温度计横过来：数轴" }, v2: { en: "Number line · from one number to the other", zh: "数轴 · 从一个数走到另一个数" },
  v3: { en: "Number line · through zero", zh: "数轴 · 经过零" },
  tag1: { en: "drag the dot", zh: "拖动圆点" }, tag2: { en: "drag either dot", zh: "两个点都能拖" }, tag3: { en: "drag either dot", zh: "两个点都能拖" },
  morning: { en: "morning", zh: "早上" }, noon: { en: "noon", zh: "中午" }, from: { en: "from", zh: "起点" }, to: { en: "to", zh: "终点" },
  resT: { en: "Subtracting a negative", zh: "减去一个负数" },
  resN: { en: "Subtraction measures the gap: the further left of zero the number you subtract, the bigger the gap. The minus sign isn't useless: it moves the starting point to the other side of zero.",
          zh: "减法看的是差距，减数越往零的左边走，差距就越大。负号可不是没有用，它把起点挪到了零的另一边。" },
  moreS: { en: "Why does it work for every number?", zh: "为什么对所有的数都成立？" },
  moreP: { en: "a − (−k) asks how many steps it is from −k to a. From −k it takes k steps to reach zero, then a more steps to reach a (if a is negative, those last steps go back left). Either way the count is k + a, which is a + k.",
           zh: "a − (−k) 问的是从 −k 走到 a 要几格。从 −k 先走 k 格到零，再走 a 格到 a（a 是负数时，这几格是往回走）。不管哪种，一共都是 k + a 格，也就是 a + k。" },
  moreR: { en: "The same thing as a pattern: 3 − 1 = 2, 3 − 0 = 3, 3 − (−1) = 4. Each time the number subtracted drops by 1, the answer goes up by 1, so 3 − (−2) has to be 5.",
           zh: "换成规律来看：3 − 1 = 2，3 − 0 = 3，3 − (−1) = 4。减数每少 1，结果就多 1，所以 3 − (−2) 只能是 5。" },
  moreQ: { en: "Next: when solving an equation, why can we take the same number from both sides?", zh: "下一个问题：为什么解方程时，两边可以同时减去同一个数？" },
  foot: { en: "Brown is the walk left of zero, green the walk right of zero, red is Xiaoyu's walk, gold is what you move. Drag or tap on the line; on a focused picture, arrow keys work too (step 1: ← → move the dot, Enter counts; steps 2 and 3: ← → move the starting dot, ↑ ↓ move the end dot).",
          zh: "棕色是零左边走的格，绿色是零右边走的格，红色是小宇走的路，金色是你能动的。在数轴上拖或点；选中图后也能用方向键（第 1 步：← → 挪圆点，回车帮你数；第 2、3 步：← → 挪起点，↑ ↓ 挪终点）。" },
};
Play.i18n(D);

const el = (id) => document.getElementById(id);
const cvEl = el("main");
const S = (v) => Play.fmt(v, 0);                       // −2
const P = (v) => (v < 0 ? `(${S(v)})` : S(v));         // (−2)
const RANGE = { 1: [-3, 6], 2: [-3, 6], 3: [-5, 7] };
const MORN = -2, NOON = 3;
const PRE2 = [[5, 2], [3, 2], [3, 1], [3, 0]];
const PRE3 = [[3, -2], [5, -1], [6, -4], [-1, -5], [-4, -1]];
const ROWS = [[5, 2], [3, 2], [3, 1], [3, 0], [3, -1], [3, -2]];

let step = 1, dirty = true;
let phase = "x", h1 = NOON, pick = -1, rose = false, playing = false, acc = 0;   // step 1
let a2 = 5, b2 = 2, seen = new Set(["5,2"]);                                       // step 2
let a3 = 3, b3 = -2, cmp = false;                                                  // step 3
let grab = null, lastB = true;

// ---------- geometry ----------
function geo(w, h) {
  const [lo, hi] = RANGE[step], len = Math.min(w - 56, 640), xl = (w - len) / 2, xr = xl + len;
  const yl = step === 3 ? 122 : 104;
  return { lo, hi, xl, xr, yl, yl2: yl + 136, unit: len / (hi - lo), X: (v) => xl + ((v - lo) / (hi - lo)) * len, w, h };
}
let Gm = null;

// ---------- drawing helpers ----------
function circle(x, cx, cy, r, fill, stroke, lw) {
  x.beginPath(); x.arc(cx, cy, r, 0, 2 * Math.PI);
  if (fill) { x.fillStyle = fill; x.fill(); }
  if (stroke) { x.strokeStyle = stroke; x.lineWidth = lw || 2; x.stroke(); }
}
const labels = (x, list, y0, size, dir) => Play.rowLabels(x, list, y0, size, Gm.w, dir * 22);   // dir +1 = down, −1 = up
function axis(x, y) {
  const { lo, hi, xl, xr, X, unit } = Gm, mu = color("--muted"), fg = color("--fg");
  x.strokeStyle = mu; x.lineWidth = 2; x.beginPath(); x.moveTo(xl - 12, y); x.lineTo(xr + 12, y); x.stroke();
  x.beginPath(); x.moveTo(xr + 12, y); x.lineTo(xr + 4, y - 5); x.moveTo(xr + 12, y); x.lineTo(xr + 4, y + 5); x.stroke();
  for (let i = lo; i <= hi; i++) {
    const z = i === 0, tk = z ? 11 : 7;
    x.strokeStyle = z ? fg : mu; x.lineWidth = z ? 2.5 : 1.6;
    x.beginPath(); x.moveTo(X(i), y - tk); x.lineTo(X(i), y + tk); x.stroke();
    Play.text(x, S(i), X(i), y + 21, { size: unit < 27 ? 13 : 14, weight: z ? 800 : 600, color: z ? fg : mu });
  }
}
// k hops of one step each, starting at `from`, direction dir; only the first `upto` are drawn; colFn(i0, i1) picks the colour
function hops(x, y, from, k, dir, upto, colFn) {
  const { X, unit, lo, hi } = Gm, hg = clamp(unit * 0.42, 9, 16);
  for (let j = 0; j < Math.min(k, upto); j++) {
    const i0 = from + j * dir, i1 = i0 + dir;
    if (Math.min(i0, i1) < lo || Math.max(i0, i1) > hi) continue;
    const x0 = X(i0), x1 = X(i1), mx = (x0 + x1) / 2, col = colFn(i0, i1);
    x.strokeStyle = col; x.lineWidth = 2.5; x.beginPath(); x.moveTo(x0, y - 3); x.quadraticCurveTo(mx, y - 3 - 2 * hg, x1, y - 3); x.stroke();
    const ang = Math.atan2(hg * 2, x1 - mx);       // tangent at the end points back up to the control point
    x.fillStyle = col; x.beginPath(); x.moveTo(x1, y - 3);
    x.lineTo(x1 - 7 * Math.cos(ang - 0.45), y - 3 - 7 * Math.sin(ang - 0.45)); x.lineTo(x1 - 7 * Math.cos(ang + 0.45), y - 3 - 7 * Math.sin(ang + 0.45)); x.fill();
    Play.text(x, String(j + 1), mx, y - hg - 16, { size: 13, weight: 750, color: col });
  }
  return hg;
}
// colour of one hop: left of zero brown, right of zero green; walking left uses blue
const hopCol = (i0, i1) => (i1 < i0 ? color("--c") : Math.max(i0, i1) <= 0 ? color("--b") : color("--a"));
function bracket(x, x0, x1, y, col, s) {
  x.strokeStyle = col; x.lineWidth = 2; x.beginPath();
  x.moveTo(x0 + 2, y + 6); x.lineTo(x0 + 2, y); x.lineTo(x1 - 2, y); x.lineTo(x1 - 2, y + 6); x.stroke();
  Play.text(x, s, (x0 + x1) / 2, y - 11, { size: 14, weight: 800, color: col });
}

function draw(x, w, h) {
  Gm = geo(w, h);
  ({ 1: draw1, 2: draw2, 3: draw3 })[step](x);
}

function draw1(x) {
  const { X, yl } = Gm, A = color("--a"), B = color("--b"), NO = color("--no"), HL = color("--hl"), fg = color("--fg"), sf = color("--surface");
  axis(x, yl);
  if (phase === "x") {
    const k = Math.abs(h1 - NOON), dir = Math.sign(h1 - NOON);
    hops(x, yl, NOON, k, dir, k, () => NO);
    circle(x, X(MORN), yl, 7, sf, B, 2.5);
    circle(x, X(NOON), yl, 7, sf, fg, 2.5);
    circle(x, X(h1), yl, 9, NO, sf, 2);
  } else {
    const k = Math.abs(h1 - MORN), dir = Math.sign(h1 - MORN);
    hops(x, yl, MORN, k, dir, k, hopCol);
    circle(x, X(MORN), yl, 7, B, sf, 2);
    circle(x, X(NOON), yl, 7, sf, fg, 2.5);
    circle(x, X(h1), yl, 10, HL, fg, 1.5);
  }
  labels(x, [{ x: X(MORN), s: `${t(D.morning)} ${S(MORN)}°`, c: B }, { x: X(NOON), s: `${t(D.noon)} ${S(NOON)}°`, c: fg }], yl + 46, 14, 1);
}

function draw2(x) {
  const { X, yl } = Gm, HL = color("--hl"), A = color("--a"), fg = color("--fg"), sf = color("--surface"), n = a2 - b2;
  axis(x, yl);
  hops(x, yl, b2, Math.abs(n), Math.sign(n), 99, hopCol);
  circle(x, X(a2), yl, 9, A, sf, 2);
  circle(x, X(b2), yl, 10, HL, fg, 1.5);
  labels(x, [{ x: X(b2), s: t(D.from), c: fg, bg: rgba(HL, 0.35) }, { x: X(a2), s: t(D.to), c: A }], yl + 46, 14, 1);
}

function draw3(x) {
  const { X, yl, yl2, lo, hi, xl, xr } = Gm, HL = color("--hl"), A = color("--a"), B = color("--b"), NO = color("--no"), fg = color("--fg"), sf = color("--surface");
  const n = a3 - b3;
  axis(x, yl);
  const hg = hops(x, yl, b3, Math.abs(n), Math.sign(n), 99, hopCol);
  if (b3 < 0 && a3 > 0) {             // the walk crosses zero: show the two parts
    const yb = yl - hg - 40;
    bracket(x, X(b3), X(0), yb, B, S(-b3));
    bracket(x, X(0), X(a3), yb, A, S(a3));
  }
  circle(x, X(a3), yl, 9, A, sf, 2);
  circle(x, X(b3), yl, 10, HL, fg, 1.5);
  labels(x, [{ x: X(b3), s: t(D.from), c: fg, bg: rgba(HL, 0.35) }, { x: X(a3), s: t(D.to), c: A }], yl + 46, 14, 1);
  if (!cmp) return;
  // non-example: a + b walks |b| steps from a
  const sum = a3 + b3;
  x.strokeStyle = color("--line"); x.lineWidth = 1; x.beginPath(); x.moveTo(12, yl + 84); x.lineTo(Gm.w - 12, yl + 84); x.stroke();
  axis(x, yl2);
  hops(x, yl2, a3, Math.abs(b3), Math.sign(b3), 99, () => NO);
  circle(x, X(a3), yl2, 7, sf, A, 2.5);
  const L = [{ x: (X(a3) + X(clamp(sum, lo, hi))) / 2, s: `${S(a3)} + ${P(b3)} = ${S(sum)}`, c: NO }];
  if (sum >= lo && sum <= hi) circle(x, X(sum), yl2, 9, NO, sf, 2);
  else L.push({ x: sum > hi ? xr : xl, s: sum > hi ? `→ ${S(sum)}` : `${S(sum)} ←`, c: NO });   // off the line: say where it lands
  labels(x, L, yl2 + 46, 15, 1);
}

// ---------- state changes ----------
function setH(v) {
  const nh = clamp(Math.round(v), RANGE[1][0], RANGE[1][1]); if (nh === h1) return;
  h1 = nh; if (phase === "r" && h1 === NOON) rose = true; render();
}
function setPhase(p) { phase = p; playing = false; h1 = p === "x" ? NOON : MORN; render(); }
function togglePlay() {
  if (phase !== "r") { phase = "r"; h1 = MORN; }
  if (Play.reduced) { h1 = NOON; rose = true; playing = false; render(); return; }
  if (!playing && h1 >= NOON) h1 = MORN;
  playing = !playing; acc = 0; render();
}
function setAB(a, b) {
  const [lo, hi] = RANGE[step];
  a = clamp(Math.round(a), lo, hi); b = clamp(Math.round(b), lo, hi);
  if (step === 2) { a2 = a; b2 = b; seen.add(a + "," + b); } else { a3 = a; b3 = b; }
  render();
}
const AB = () => (step === 2 ? [a2, b2] : [a3, b3]);

Play.drag(cvEl, {
  down(px, py) {
    if (!Gm) return false;
    const { xl, xr, yl, lo, hi } = Gm, v = lo + ((px - xl) / (xr - xl)) * (hi - lo);
    if (px < xl - 24 || px > xr + 24 || Math.abs(py - yl) > 44) return false;
    playing = false;
    if (step === 1) { grab = "h"; setH(v); return true; }
    const [a, b] = AB(), da = Math.abs(v - a), db = Math.abs(v - b);
    grab = da < db || (da === db && !lastB) ? "a" : "b";
    lastB = grab === "b";
    setAB(grab === "a" ? v : a, grab === "b" ? v : b);
    return true;
  },
  move(px) {
    if (!grab) return;
    const { xl, xr, lo, hi } = Gm, v = lo + ((px - xl) / (xr - xl)) * (hi - lo);
    if (grab === "h") setH(v);
    else { const [a, b] = AB(); setAB(grab === "a" ? v : a, grab === "b" ? v : b); }
  },
  up() { grab = null; },
});
const mv = (da, db) => { const [a, b] = AB(); lastB = db !== 0; setAB(a + da, b + db); };
Play.keys(cvEl, {
  ArrowRight: () => (step === 1 ? ((playing = false), setH(h1 + 1)) : mv(0, 1)),
  ArrowLeft: () => (step === 1 ? ((playing = false), setH(h1 - 1)) : mv(0, -1)),
  ArrowUp: () => step !== 1 && mv(1, 0),
  ArrowDown: () => step !== 1 && mv(-1, 0),
  Enter: () => step === 1 && togglePlay(),
});

// ---------- explanations ----------
const span = (c, s) => `<span class="${c}">${s}</span>`;
function explain1() {
  const done = rose;
  let out = `<div class="kicker">${t({ en: "Step 01 · Xiaoyu's answer", zh: "第 1 步 · 小宇的答案" })}</div>
    <h2>${t({ en: "It was −2° this morning and 3° at noon. How much did it rise?", zh: "早上 −2°，中午 3°，气温升了几度？" })}</h2>
    <div class="mathline">3 − (−2) = ?</div>
    <div class="choices">${[1, 5].map((v, i) => `<button data-c="${i}" class="${pick === i ? "on" : ""}${done && pick === i ? (v === 5 ? " ok" : " bad") : ""}">${v}</button>`).join("")}</div>`;
  if (phase === "x") {
    const k = NOON - h1;
    out += `<p>${t({ en: "Xiaoyu works it out as one: three minus two is one, and the minus sign seems to do nothing.", zh: "小宇却算成了一：三减二是一，负号好像没什么用。" })}</p>`;
    if (h1 === 1) {
      out += `<p class="big"><span class="tag-no">${t({ en: "Landed on 1.", zh: "停在了 1。" })}</span> ${t({ en: "Two steps left from 3 is 3 + (−2) = 1. That's adding a negative, not subtracting one.", zh: "从 3 往左走两格，是 3 + (−2) = 1。那是加一个负数，不是减一个负数。" })}</p>
        <p>${t({ en: "And the temperature never went from 3 down to 1. It went from −2 up to 3. Press “Count the rise”.", zh: "气温也从没从 3 降到 1，它是从 −2 升到 3 的。点「数气温升了几格」。" })}</p>`;
    } else {
      out += `<p class="big">${t({ en: "Where does his 1 come from? Drag the red dot the way his 1 goes: from 3, two steps left.", zh: "他的 1 从哪来？把红点照这个 1 的走法拖一拖：从 3 往左走两格。" })}</p>
        <p>${k === 0 ? t({ en: "The red dot is on 3.", zh: "红点在 3 上。" })
          : k > 0 ? t({ en: `From 3, ${k} ${k === 1 ? "step" : "steps"} left: 3 + ${P(-k)} = ${S(h1)}.`, zh: `从 3 往左 ${k} 格：3 + ${P(-k)} = ${S(h1)}。` })
          : t({ en: `From 3, ${-k} ${k === -1 ? "step" : "steps"} right: 3 + ${-k} = ${S(h1)}.`, zh: `从 3 往右 ${-k} 格：3 + ${-k} = ${S(h1)}。` })}</p>`;
    }
    return out;
  }
  const k = h1 - MORN, past0 = Math.max(0, Math.min(h1, NOON));
  out += `<p>${t({ en: "Subtraction asks how far apart two numbers are. Walk from the morning's −2 to the noon's 3, one step at a time.", zh: "减法问的是两个数差多少。从早上的 −2 走到中午的 3，一格一格走。" })}</p>`;
  if (h1 === NOON) {
    out += `<div class="mathline">${span("cb", 2)} + ${span("ca", 3)} = <span class="ans">5</span></div>
      <p class="big">${t({ en: "Two steps to reach zero, then three more to reach three. Five steps in all: it rose five degrees, so three minus negative two is five.",
                      zh: "先两格到零，再三格才到三。一共是五格：气温升了五度，所以三减负二等于五。" })}</p>
      <p>${pick === 0 ? `<span class="tag-no">${t({ en: "Not 1.", zh: "不是 1。" })}</span> ` : ""}${t({ en: "The minus sign isn't useless: it moves the starting point to the other side of zero.", zh: "负号可不是没有用，它把起点挪到了零的另一边。" })}</p>`;
  } else {
    const msg = k < 0 ? t({ en: "The gold dot is left of the morning's −2. Drag it right.", zh: "金点在早上 −2 的左边了，往右拖。" })
      : k === 0 ? t({ en: "Drag the gold dot to the right, or press “Count for me”.", zh: "把金点往右拖，或点「帮我数」。" })
      : h1 > NOON ? t({ en: `That's ${k} steps, past noon's 3. Come back to 3.`, zh: `这是 ${k} 格，走过了中午的 3。回到 3。` })
      : t({ en: `${k} ${k === 1 ? "step" : "steps"} so far${h1 > 0 ? `: 2 to reach zero, then ${past0} more` : ""}. Keep going to 3.`, zh: `已经 ${k} 格${h1 > 0 ? `：两格到零，又走了 ${past0} 格` : ""}。继续走到 3。` });
    out += `<p class="big">${msg}</p>`;
  }
  return out;
}

function explain2() {
  const n = a2 - b2;
  const row = ([a, b]) => {
    const key = a + "," + b, on = a === a2 && b === b2, ok = seen.has(key);
    return `<button data-a="${a}" data-b="${b}" class="${on ? "on" : ""}${ok ? "" : " unseen"}${b < 0 ? " neg" : ""}">${S(a)} − ${P(b)} = ${ok ? S(a - b) : "?"}</button>`;
  };
  let out = `<div class="kicker">${t({ en: "Step 02 · how far apart", zh: "第 2 步 · 相差多少" })}</div>
    <h2>${t({ en: "Subtraction is really asking: how far apart are these two numbers?", zh: "减法其实在问：这两个数相差多少。" })}</h2>
    <div class="mathline">${span("ca", S(a2))} − ${span("cg", P(b2))} = <span class="ans">${S(n)}</span></div>`;
  if (n === 0) out += `<p class="big">${t({ en: "Both dots are on the same number: zero steps apart.", zh: "两个点在同一个数上，差零格。" })}</p>`;
  else if (n > 0) out += `<p class="big">${t({ en: `Walk from ${S(b2)} to ${S(a2)}: ${n} ${n === 1 ? "step" : "steps"}. The number of steps is the answer.`, zh: `从 ${S(b2)} 走到 ${S(a2)}：${n} 格。走了几格，答案就是几。` })}</p>`;
  else out += `<p class="big">${t({ en: `Walk from ${S(b2)} to ${S(a2)}: ${-n} ${n === -1 ? "step" : "steps"}, but to the left, so the answer is ${S(n)}.`, zh: `从 ${S(b2)} 走到 ${S(a2)}：${-n} 格，但是往左走，所以答案是 ${S(n)}。` })}</p>`;
  out += `<div class="rows">${ROWS.map(row).join("")}</div>`;
  const allPos = [[3, 2], [3, 1], [3, 0]].every(([a, b]) => seen.has(a + "," + b)), negSeen = seen.has("3,-2");
  if (negSeen) out += `<p>${t({ en: "Negative two is left of zero, further from three, so the gap is even bigger than three minus zero.", zh: "负二在零的左边，离三更远，差距反而比三减零还大。" })}</p>`;
  else if (allPos) out += `<p>${t({ en: "The smaller the number we subtract, the bigger the gap. So three minus negative two: from negative two to three, how many steps? Drag the gold dot past zero.", zh: "减去的数越小，差得就越多。那三减负二，从负二走到三，要走几格？把金点拖过零。" })}</p>`;
  else out += `<p class="note">${t({ en: "Keep the green dot on 3 and move the gold dot one step at a time. The rows fill in as you go.", zh: "绿点留在 3，金点一格一格挪，表格会跟着填上。" })}</p>`;
  return out;
}

function explain3() {
  const n = a3 - b3, k = -b3;
  let out = `<div class="kicker">${t({ en: "Step 03 · past zero", zh: "第 3 步 · 越过零" })}</div>`;
  if (b3 < 0) {
    out += `<h2>${t({ en: `Subtracting ${S(b3)} is adding ${k}`, zh: `减去 ${S(b3)}，就是加上 ${k}` })}</h2>
      <div class="mathline">${span("ca", S(a3))} − ${span("cg", P(b3))} = ${S(a3)} + ${span("cb", k)} = <span class="ans">${S(n)}</span></div>`;
    if (a3 > 0) out += `<p class="big">${t({ en: `Start at ${S(b3)}: ${span("cb", k)} ${k === 1 ? "step" : "steps"} to reach zero, then ${span("ca", a3)} more to reach ${a3}. ${k} + ${a3} = ${n} steps.`,
                                       zh: `从 ${S(b3)} 出发，先走 ${span("cb", k)} 格到零，再走 ${span("ca", a3)} 格才到 ${a3}。${k} + ${a3} = ${n} 格。` })}</p>`;
    else if (n > 0) out += `<p class="big">${t({ en: `From ${S(b3)} to ${S(a3)}: ${n} ${n === 1 ? "step" : "steps"} right. Same as ${S(a3)} + ${k}: start at ${S(a3)} and walk ${k} right.`, zh: `从 ${S(b3)} 到 ${S(a3)}：往右 ${n} 格。和 ${S(a3)} + ${k} 一样：从 ${S(a3)} 往右走 ${k} 格。` })}</p>`;
    else if (n < 0) out += `<p class="big">${t({ en: `From ${S(b3)} to ${S(a3)} is ${-n} ${n === -1 ? "step" : "steps"} to the left, so the answer is ${S(n)}. Same as ${S(a3)} + ${k}.`, zh: `从 ${S(b3)} 到 ${S(a3)} 是往左 ${-n} 格，所以答案是 ${S(n)}。和 ${S(a3)} + ${k} 一样。` })}</p>`;
    else out += `<p class="big">${t({ en: "Both dots are on the same number: zero steps apart.", zh: "两个点在同一个数上，差零格。" })}</p>`;
  } else {
    out += `<h2>${t({ en: "Subtraction measures the gap", zh: "减法看的是差距" })}</h2>
      <div class="mathline">${span("ca", S(a3))} − ${span("cg", S(b3))} = <span class="ans">${S(n)}</span></div>
      <p class="big">${t({ en: `From ${S(b3)} to ${S(a3)}: ${Math.abs(n)} ${Math.abs(n) === 1 ? "step" : "steps"}${n < 0 ? " to the left" : ""}. Drag the gold dot left of zero to subtract a negative.`, zh: `从 ${S(b3)} 到 ${S(a3)}：${n < 0 ? "往左 " : ""}${Math.abs(n)} 格。把金点拖到零的左边，就是减一个负数。` })}</p>`;
  }
  if (cmp && b3 !== 0) {
    const s = a3 + b3;
    out += `<p><span class="cn">${S(a3)} + ${P(b3)} = ${S(s)}</span> ${t(b3 < 0
      ? { en: `walks ${k} ${k === 1 ? "step" : "steps"} left from ${S(a3)}, stopping at ${S(s)}. That's a different question.`, zh: `是从 ${S(a3)} 往左走 ${k} 格，停在 ${S(s)}，问的是另一件事。` }
      : { en: `walks ${b3} ${b3 === 1 ? "step" : "steps"} right from ${S(a3)}, stopping at ${S(s)}. A different question again.`, zh: `是从 ${S(a3)} 往右走 ${b3} 格，停在 ${S(s)}，也是另一件事。` })}</p>`;
  } else if (!cmp) {
    out += `<p class="note">${t({ en: "Press “Compare with +” to see where adding would land.", zh: "点「和加法比一比」，看看加法会停在哪。" })}</p>`;
  }
  return out;
}

const HEIGHT = () => (step === 3 ? (cmp ? 350 : 200) : 190);
function render() {
  el("explain").innerHTML = ({ 1: explain1, 2: explain2, 3: explain3 })[step]();
  el("vtitle").textContent = t(D["v" + step]);
  el("vtag").textContent = t(D["tag" + step]);
  [1, 2, 3].forEach((i) => (el("c" + i).hidden = step !== i));
  el("phX").classList.toggle("on", phase === "x"); el("phR").classList.toggle("on", phase === "r");
  el("play").textContent = t(playing ? D.pauseB : D.playB);
  el("pre2").innerHTML = PRE2.map(([a, b]) => `<button data-a="${a}" data-b="${b}" class="${a === a2 && b === b2 ? "on" : ""}">${S(a)} − ${P(b)}</button>`).join(" ");
  el("pre3").innerHTML = PRE3.map(([a, b]) => `<button data-a="${a}" data-b="${b}" class="${a === a3 && b === b3 ? "on" : ""}">${P(a)} − ${P(b)}</button>`).join(" ");
  el("cmp").classList.toggle("on", cmp);
  cvEl.style.height = HEIGHT() + "px";
  dirty = true;
}

const pickAB = (e) => { const b = e.target.closest("[data-a]"); if (b) setAB(+b.dataset.a, +b.dataset.b); };
el("explain").addEventListener("click", (e) => {
  const c = e.target.closest("[data-c]");
  if (c) { pick = +c.dataset.c; render(); return; }
  pickAB(e);
});
el("pre2").addEventListener("click", pickAB);
el("pre3").addEventListener("click", pickAB);
el("phX").onclick = () => setPhase("x");
el("phR").onclick = () => setPhase("r");
el("play").onclick = togglePlay;
el("cmp").onclick = () => { cmp = !cmp; render(); };

const nav = Play.steps(document.querySelector(".steps"), (s) => { step = s; playing = false; grab = null; render(); });
el("reset").onclick = () => {
  phase = "x"; h1 = NOON; pick = -1; rose = false; playing = false;
  a2 = 5; b2 = 2; seen = new Set(["5,2"]); a3 = 3; b3 = -2; cmp = false; nav.set(1);
};
el("resM").textContent = `3 − ${P(-2)} = 3 + 2 = ${S(3 - -2)}`;

const cv = Play.canvas(cvEl, draw);
Play.loop((dt) => {
  if (playing && step === 1) {
    acc += dt;
    if (acc > 0.55) {
      acc = 0;
      if (h1 < NOON) setH(h1 + 1);
      if (h1 >= NOON) { playing = false; render(); }
    }
  }
  if (dirty) { dirty = false; cv.redraw(); }
});
nav.set(1);
</script>
</body>
</html>
